[project]
name = "runbook"
version = "0.1.0"
description = "Markdown手順書 自動実行フレームワーク"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
runbook = "runbook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runbook*"]
